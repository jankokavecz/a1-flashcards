<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Deutsch B1</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css?v=2026-10-29.0801.ed37a67">
</head>
<body>
    <div id="app">
        <!-- Plan Screen (default home tab, shown first) -->
        <div id="plan-screen" class="screen active">
            <header class="screen-header">
                <h1>🗓️ Plan</h1>
            </header>
            <div class="plan-content" id="plan-content">
                <!-- populated by JS -->
            </div>
        </div>

        <!-- Cards Screen -->
        <div id="cards-screen" class="screen">
            <header class="screen-header">
                <h1>Flashcards</h1>
                <select id="category-filter">
                    <option value="all">All topics</option>
                    <!-- populated by JS -->
                </select>
            </header>
            <div class="cards-mode-bar" id="cards-mode-bar">
                <div class="seg" id="cards-mode-seg">
                    <button type="button" data-mode="daily" onclick="setCardsMode('daily')">Today</button>
                    <button type="button" data-mode="mydeck" onclick="setCardsMode('mydeck')">📚 My Deck <span class="seg-count" id="cards-mydeck-count"></span></button>
                </div>
            </div>
            <div class="cards-practice-banner hidden" id="cards-practice-banner">
                <span id="cards-practice-label"></span>
                <button type="button" onclick="exitPracticeSession()">✕ Done</button>
            </div>
            <div class="cards-toolbar">
                <button type="button" class="cards-counters" id="cards-introduced-counter" onclick="openMyWords({state:'seen'})"></button>
                <label title="New words come only from A1 and the B1 core list; reviews are not affected"><input type="checkbox" id="core-only-toggle" onchange="toggleCoreOnly()"> New: core only</label>
                <label><input type="checkbox" id="speak-on-flip-toggle" onchange="toggleSpeakOnFlip()"> 🔊 Speak on flip</label>
            </div>
            <div class="cards-mode-note" id="cards-mode-note"></div>
            <div class="cards-content">
                <div class="session-info">
                    <span id="card-counter">1 / 20</span>
                    <div class="session-progress-bar">
                        <div id="session-progress" class="progress-fill"></div>
                    </div>
                </div>
                <div class="card-container">
                    <div class="flashcard" id="flashcard" onclick="flipCard()">
                        <div class="card-inner">
                            <div class="card-front">
                                <button class="card-speaker-btn" onclick="event.stopPropagation(); speakCurrentWord()">🔊</button>
                                <div class="card-type-badge" id="card-type"></div>
                                <div class="card-level" id="card-level"></div>
                                <div class="card-word" id="card-front-word" lang="de"></div>
                                <div class="card-hint" id="card-hint">Tap to flip</div>
                            </div>
                            <div class="card-back">
                                <button class="card-speaker-btn" onclick="event.stopPropagation(); speakCurrentWord()">🔊</button>
                                <div class="card-translation" id="card-translation"></div>
                                <div class="card-example" id="card-example-de"></div>
                                <div class="card-example-en" id="card-example-en"></div>
                                <div class="card-details" id="card-details"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="btn btn-learning" onclick="gradeCard('again')">Again</button>
                    <button class="btn btn-good" onclick="gradeCard('good')">Good</button>
                    <button class="btn btn-known" onclick="gradeCard('easy')">Easy</button>
                </div>
            </div>
        </div>

        <!-- Words Screen -->
        <div id="words-screen" class="screen">
            <header class="screen-header">
                <h1>📖 My Words</h1>
            </header>
            <div class="mywords-content" id="mywords-content">
                <!-- populated by renderMyWords() in app.js -->
            </div>
        </div>

        <!-- Test Screen -->
        <div id="test-screen" class="screen">
            <header class="screen-header">
                <h1>Test</h1>
                <select id="test-category-filter">
                    <option value="all">All Categories</option>
                </select>
            </header>
            <div class="test-content">
                <div id="hands-free-bar" class="hands-free-bar hidden">
                    <span class="hands-free-label">🎤 Hands-free</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="hands-free-toggle">
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    </label>
                </div>
                <div class="test-score" id="test-score">
                    <span id="test-correct">0</span> / <span id="test-total">10</span> correct
                </div>
                <div class="test-progress-bar">
                    <div id="test-progress" class="progress-fill"></div>
                </div>
                <div class="test-question" id="test-question">
                    <div class="test-prompt" id="test-prompt"></div>
                    <div class="test-options" id="test-options"></div>
                    <div id="mic-indicator" class="mic-indicator hidden">
                        <div class="mic-pulse"></div>
                        <span class="mic-status">Listening…</span>
                    </div>
                </div>
                <div class="test-result" id="test-result" style="display:none">
                    <div class="test-result-icon" id="test-result-icon"></div>
                    <div class="test-result-score" id="test-result-score"></div>
                    <div class="test-result-message" id="test-result-message"></div>
                    <button class="btn btn-primary" onclick="startTest()">Try Again</button>
                </div>
            </div>
        </div>

        <!-- Scenes Screen -->
        <div id="scenes-screen" class="screen">
            <header class="screen-header">
                <h1>Scenes</h1>
            </header>
            <div class="scenes-content" id="scenes-content">
                <!-- populated by JS -->
            </div>
        </div>

        <!-- Tracks Screen -->
        <div id="tracks-screen" class="screen">
            <header class="screen-header">
                <h1>🎧 Tracks</h1>
            </header>
            <div class="tracks-content" id="tracks-content">
                <!-- populated by JS -->
            </div>
        </div>

        <!-- Grammar Screen -->
        <div id="grammar-screen" class="screen">
            <header class="screen-header">
                <h1>Grammar</h1>
            </header>
            <div class="grammar-content" id="grammar-content">
                <!-- populated by JS -->
            </div>
        </div>

        <!-- Exam Screen -->
        <div id="exam-screen" class="screen">
            <header class="screen-header">
                <h1>🎓 Exam</h1>
            </header>
            <div class="exam-content" id="exam-content">
                <!-- populated by JS -->
            </div>
        </div>

        <!-- Calls Screen -->
        <div id="calls-screen" class="screen">
            <header class="screen-header">
                <h1>🗣️ Speak</h1>
            </header>
            <div class="calls-content" id="calls-content">
                <!-- populated by JS -->
            </div>
        </div>

        <!-- Daily Log Screen -->
        <div id="log-screen" class="screen">
            <header class="screen-header">
                <h1>📋 Daily Log</h1>
            </header>
            <div class="log-content" id="log-content">
                <!-- populated by JS -->
            </div>
        </div>

        <!-- Settings Screen: version, updates, backup -->
        <div id="settings-screen" class="screen">
            <header class="screen-header">
                <h1>⚙️ Settings</h1>
            </header>
            <div class="settings-content" id="settings-content">
                <!-- populated by renderSettings() in app.js -->
            </div>
        </div>

        <!-- Bottom Tab Bar -- populated by rebuildTabBar() in app.js -->
        <nav class="tab-bar"></nav>

        <!-- More sheet: every tab not in the primary bar -->
        <div id="more-sheet" class="more-sheet">
            <div class="more-sheet-backdrop" onclick="closeMoreSheet()"></div>
            <div class="more-sheet-panel">
                <div class="more-sheet-handle"></div>
                <div class="more-sheet-list" id="more-sheet-list">
                    <!-- populated by JS -->
                </div>
                <div class="more-sheet-version" id="more-sheet-version"></div>
            </div>
        </div>

        <!-- Word detail sheet (My Words) -->
        <div id="word-sheet" class="more-sheet word-sheet">
            <div class="more-sheet-backdrop" onclick="closeWordSheet()"></div>
            <div class="more-sheet-panel word-sheet-panel">
                <div class="more-sheet-handle"></div>
                <button type="button" class="word-sheet-close" onclick="closeWordSheet()" aria-label="Close">✕</button>
                <div class="word-sheet-body" id="word-sheet-body"></div>
            </div>
        </div>

        <!-- Tick what you know (My Words): full-screen sorting list, built by openTickView() in app.js -->
        <div id="tick-view" class="tick-view" role="dialog" aria-modal="true" aria-label="Tick what you know" aria-hidden="true"></div>
    </div>

    <script src="version.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="words.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="a1-verb-forms.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="grammar.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="scenarios.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="exam.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="calls.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="b1-plan.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="b1-tracks.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="b1-tracks-2.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="b1-exam-data.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="b1-words.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="b1-grammar.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="b1-scenes.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="b1-calls.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="plan.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="tracks.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="log.js?v=2026-10-29.0801.ed37a67"></script>
    <script src="app.js?v=2026-10-29.0801.ed37a67"></script>
</body>
</html>
